<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media conversion verification</title><style>body{font:16px Arial;background:#101113;color:white;padding:24px}button{padding:14px;margin:5px;background:#fcd34d;border:0;border-radius:8px}video,img{max-width:600px;width:100%;max-height:450px;object-fit:contain;display:block;margin-top:16px}</style><h1>Media conversion verification</h1><p>Local test files only. No gallery records or uploads are created.</p><button data-format="mov">Convert MOV</button><button data-format="heic">Convert HEIC</button><button data-format="tiff">Convert TIFF</button><button data-format="png">Convert PNG</button><p role="status" id="status">Ready</p><video id="video" controls muted playsinline hidden></video><img id="photo" alt="Converted photo preview" hidden><script type="module">
import {prepareShowcaseMedia} from '/src/lib/showcaseMedia.js';
for(const button of document.querySelectorAll('button'))button.onclick=async()=>{const format=button.dataset.format;const status=document.getElementById('status');status.textContent='Starting '+format;try{const r=await fetch('/__gallery-fixture.'+format);if(!r.ok)throw Error('Fixture fetch '+r.status);const bytes=await r.blob();const file=new File([bytes],'fixture.'+format,{type:format==='mov'?'video/quicktime':format==='heic'?'image/heic':'image/'+format});const result=await prepareShowcaseMedia(file,message=>status.textContent=message);const output=result.kind==='video'?document.getElementById('video'):document.getElementById('photo');output.hidden=false;output.src=URL.createObjectURL(result.file);if(result.kind==='video'){output.onloadedmetadata=()=>{status.textContent='PASS MOV → '+result.file.type+' · '+output.videoWidth+' × '+output.videoHeight+' · '+output.duration+' seconds · poster '+Boolean(result.poster);};await output.play();}else{output.onload=()=>{status.textContent='PASS '+format.toUpperCase()+' → '+result.file.type+' · '+output.naturalWidth+' × '+output.naturalHeight;};}}catch(error){status.textContent='FAIL '+format+': '+error.message;}};
</script></html>
