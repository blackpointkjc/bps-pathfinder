<!doctype html><html><meta charset="utf-8"><title>Workspace preload test</title><body style="background:#090909;color:#e8cf71;font:18px Arial;padding:32px"><h1>Workspace preparation test</h1><p>No account is signed in and no page is mounted.</p><button id="start" style="padding:16px">Prepare all tool modules</button><p id="result" role="status">Ready to test</p><script type="module">import{prepareToolLoaders}from'/src/lib/workspacePreparation.js';const modules={...import.meta.glob('/src/pages/*.jsx'),...import.meta.glob('/src/components/**/*.jsx')};document.getElementById('start').onclick=async()=>{document.getElementById('start').disabled=true;const errors=[];try{await prepareToolLoaders(Object.entries(modules).map(([path,load])=>async()=>{try{await load();}catch(error){errors.push(path+': '+error.message);throw error;}}),{onProgress:p=>document.getElementById('result').textContent='Preparing tools '+p.completed+' / '+p.total});document.getElementById('result').textContent='PASS: All '+Object.keys(modules).length+' tool modules prepared.';}catch(e){document.getElementById('result').textContent='FAILED: '+errors.join(' | ');}document.getElementById('start').disabled=false;};</script></body></html>
